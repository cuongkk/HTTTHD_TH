<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ thành phần solution QTKD tuần 05</title>
  <desc id="desc">Request từ Swagger hoặc Postman đi qua Controller, Service, Repository, QtkdDbContext đến PostgreSQL. Customer liên kết một nhiều với Contract; PriceList liên kết một nhiều với PriceItem.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526581"/>
    </marker>
  </defs>
  <rect width="1200" height="430" fill="#f7f9fc"/>
  <text x="40" y="49" fill="#172943" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">QTKD · Sơ đồ thành phần tuần 05</text>
  <text x="40" y="77" fill="#526581" font-family="Segoe UI, Arial, sans-serif" font-size="16">Luồng GET đọc dữ liệu từ PostgreSQL</text>

  <rect x="207" y="96" width="766" height="145" rx="18" fill="#eaf1fa" stroke="#c8d9ec" stroke-width="2"/>
  <text x="225" y="117" fill="#405a78" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">QTKD.Api · ASP.NET Core Web API</text>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="28" y="132" width="158" height="88" rx="12" fill="#ffffff" stroke="#9fb4cf" stroke-width="2"/>
    <text x="107" y="169" fill="#172943" font-size="18" font-weight="700">HTTP client</text>
    <text x="107" y="194" fill="#526581" font-size="14">Swagger / Postman</text>

    <rect x="225" y="132" width="160" height="88" rx="12" fill="#ffffff" stroke="#7097c7" stroke-width="2"/>
    <text x="305" y="169" fill="#172943" font-size="18" font-weight="700">Controller</text>
    <text x="305" y="194" fill="#526581" font-size="13">HTTP + status</text>

    <rect x="422" y="132" width="160" height="88" rx="12" fill="#ffffff" stroke="#7097c7" stroke-width="2"/>
    <text x="502" y="169" fill="#172943" font-size="18" font-weight="700">Service</text>
    <text x="502" y="194" fill="#526581" font-size="13">Entity → DTO</text>

    <rect x="619" y="132" width="160" height="88" rx="12" fill="#ffffff" stroke="#7097c7" stroke-width="2"/>
    <text x="699" y="169" fill="#172943" font-size="18" font-weight="700">Repository</text>
    <text x="699" y="194" fill="#526581" font-size="13">Truy vấn EF Core</text>

    <rect x="816" y="132" width="139" height="88" rx="12" fill="#ffffff" stroke="#7097c7" stroke-width="2"/>
    <text x="885.5" y="169" fill="#172943" font-size="17" font-weight="700">DbContext</text>
    <text x="885.5" y="194" fill="#526581" font-size="13">Npgsql</text>

    <rect x="994" y="132" width="177" height="88" rx="12" fill="#e2f3ea" stroke="#5ca781" stroke-width="2"/>
    <text x="1082.5" y="169" fill="#174936" font-size="18" font-weight="700">PostgreSQL</text>
    <text x="1082.5" y="194" fill="#3d7058" font-size="13">4 bảng dữ liệu</text>
  </g>

  <g stroke="#526581" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M 187 176 H 220"/>
    <path d="M 386 176 H 417"/>
    <path d="M 583 176 H 614"/>
    <path d="M 780 176 H 811"/>
    <path d="M 956 176 H 989"/>
  </g>

  <text x="40" y="290" fill="#172943" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Quan hệ dữ liệu trong QtkdDbContext</text>
  <rect x="40" y="312" width="540" height="85" rx="12" fill="#ffffff" stroke="#c8d9ec" stroke-width="2"/>
  <text x="310" y="348" text-anchor="middle" fill="#172943" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Customer (1) → Contract (N)</text>
  <text x="310" y="375" text-anchor="middle" fill="#526581" font-family="Segoe UI, Arial, sans-serif" font-size="15">Contract.CustomerId là khóa ngoại</text>
  <rect x="620" y="312" width="540" height="85" rx="12" fill="#ffffff" stroke="#c8d9ec" stroke-width="2"/>
  <text x="890" y="348" text-anchor="middle" fill="#172943" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">PriceList (1) → PriceItem (N)</text>
  <text x="890" y="375" text-anchor="middle" fill="#526581" font-family="Segoe UI, Arial, sans-serif" font-size="15">PriceItem.PriceListId là khóa ngoại</text>
</svg>
